<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style/search.css">
  <title>Favoris</title>
</head>

<body class="{{.ThemeClass}}">

  <h1 class="title">Mes Favoris ({{.Total}})</h1>

  <div style="text-align:center; margin-bottom: 20px;">
    <a class="btn" href="/search{{if .ThemeParam}}?{{.ThemeParam}}{{end}}">⬅ Retour à la recherche</a>
  </div>

  <div class="results">
    {{ if .Results }}
      {{ range .Results }}
        <div class="card">
          <a href="/character?id={{ .ID }}{{if $.ThemeParam}}&{{$.ThemeParam}}{{end}}" style="text-decoration:none; color:inherit;">
            <img src="{{ .Image }}" alt="{{ .Name }}">
            <h2>{{ .Name }}</h2>
          </a>

          <p>{{ .Race }} — {{ .Affiliation }}</p>

          <a class="fav-btn" href="/favorites/remove?id={{ .ID }}{{if $.ThemeParam}}&{{$.ThemeParam}}{{end}}" title="Retirer des favoris">
            <img src="/assets/UsedDragonBall.jpg" alt="Retirer" width="32" height="32">
          </a>
        </div>
      {{ end }}
    {{ else }}
      <p style="text-align:center;">Tu n’as pas encore de favoris.</p>
    {{ end }}
  </div>

</body>
</html>
