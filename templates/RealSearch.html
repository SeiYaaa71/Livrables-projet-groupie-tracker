<link rel="stylesheet" href="/style/search.css">

<h1 class="title">Recherche de personnages</h1>

<form class="search-form" method="GET" action="/search">
  <input type="text" name="name" placeholder="Nom..." value="{{ .Query }}">

  <select name="race">
    <option value="">-- Race --</option>
    <option value="Saiyan" {{if eq .Race "Saiyan"}}selected{{end}}>Saiyan</option>
    <option value="Human" {{if eq .Race "Human"}}selected{{end}}>Human</option>
    <option value="Namekian" {{if eq .Race "Namekian"}}selected{{end}}>Namekian</option>
  </select>

  <select name="affiliation">
    <option value="">-- Affiliation --</option>
    <option value="Z Fighter" {{if eq .Affiliation "Z Fighter"}}selected{{end}}>Z Fighter</option>
    <option value="Army of Frieza" {{if eq .Affiliation "Army of Frieza"}}selected{{end}}>Army of Frieza</option>
  </select>

  <button type="submit">Rechercher</button>
</form>

<div class="results">
  {{ if .Results }}
    {{ range .Results }}
      <div class="card">
        <img src="{{ .Image }}" alt="{{ .Name }}">
        <h2>{{ .Name }}</h2>
        <p>{{ .Race }} — {{ .Affiliation }}</p>
      </div>
    {{ end }}
  {{ else }}
    <p style="text-align:center;">Aucun résultat</p>
  {{ end }}
</div>
