<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>

  <link rel="stylesheet" href="/style/base.css">
  <link rel="stylesheet" href="/style/theme-classic.css">
  <link rel="stylesheet" href="/style/theme-ui.css">
</head>

<body class="{{.ThemeClass}}">
<header class="main-header">
  <div class="header-spacer"></div>
  <h1>DRAGON BALL Z ENCYCLOPEDIA</h1>
  <nav class="top-nav">
    <a class="btn btn-small" href="/characters{{if .ThemeParam}}?{{.ThemeParam}}{{end}}">Encyclopédie</a>
    <a class="btn btn-small" href="/search{{if .ThemeParam}}?{{.ThemeParam}}{{end}}">Recherche</a>
    <a class="btn btn-small" href="/favorites{{if .ThemeParam}}?{{.ThemeParam}}{{end}}">Favoris</a>

    <!-- Bouton toggle thème -->
    {{ if .ThemeParam }}
    <a class="btn btn-small" href="/dashboard?theme=classic">Changer le thème</a>
    {{ else }}
    <a class="btn btn-small" href="/dashboard?theme=ui">Changer le thème</a>
    {{ end }}
  </nav>
</header>

<main class="homepage-splash">
  <div class="container" style="max-width: 520px;">
    <h2 style="text-align:center; margin:0 0 14px;">Recherche rapide</h2>

    <form action="/search" method="GET" style="display:grid; gap:12px;">
      {{ if .ThemeParam }}
      <input type="hidden" name="theme" value="ui">
      {{ end }}

      <label for="name">Nom du personnage</label>
      <input type="text" id="name" name="name" placeholder="Ex: Goku">

      <button type="submit" class="btn" style="width:100%;">Rechercher</button>
    </form>

    <div style="display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap;">
      <a class="btn btn-small" href="/search{{if .ThemeParam}}?{{.ThemeParam}}{{end}}">Recherche avancée</a>
      <a class="btn btn-small" href="/characters{{if .ThemeParam}}?{{.ThemeParam}}{{end}}">Voir tous</a>
    </div>
  </div>
</main>

<footer>
  <small>Dragon Ball API Search — 2026</small>
</footer>
</body>
</html>
